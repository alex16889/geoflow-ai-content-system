name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, curl, mbstring
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Open-source release audit
        run: sh bin/git/check-open-source-release.sh

      - name: PHP syntax check
        run: |
          find admin includes api bin -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -l index.php
          php -l article.php
          php -l category.php
          php -l archive.php
          php -l router.php
          php -l sitemap.php
          php -l robots.php
          php -l llms.php
          php -l theme-preview.php
          php -l bin/publisher
          find includes/publisher -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Unit guardrail tests
        run: |
          php tests/unit_multisite_schema_guards.php
          php tests/unit_dataforseo_defaults.php
          php tests/unit_dataforseo_duplicate_guard.php
          php tests/unit_dataforseo_request_splitting.php
          php tests/unit_growth_guardrails.php
          php tests/unit_seo_geo_ops.php
          php tests/unit_publisher.php
          php tests/unit_error_responses.php

      - name: Build Tailwind assets
        run: npm run build:tailwind

      # Tailwind 3 is build-only. Its dependency tree still includes braces,
      # and npm's non-breaking fix does not clear that advisory. The PHP
      # application has no runtime npm packages, so audit those only.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate
